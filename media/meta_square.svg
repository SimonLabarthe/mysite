<!-- Square favicon wrapper: the 32x23 dino PNG is centred in a 32x32 box
     so browsers no longer stretch it to a square. The PNG is embedded (base64)
     because SVG favicons are not allowed to load external images. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <image x="0" y="4.5" width="32" height="23" preserveAspectRatio="xMidYMid meet"
         href="data:image/png;base64,"/>
</svg>
